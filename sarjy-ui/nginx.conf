server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Docker's embedded DNS. A literal upstream name in `proxy_pass` is resolved
    # once, at startup, and cached for the life of the process: recreating only
    # the `backend` service gives it a new address and every /api call 502s until
    # this container is restarted too. Resolving through a variable re-resolves.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # `backend` is the compose service name. Same origin as the app, so no CORS.
    location /api/ {
        set $backend_upstream backend;
        proxy_pass http://$backend_upstream:8000$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # A chat turn waits on the model, and the streaming endpoint the latency
        # work adds must reach the browser token by token rather than in one
        # buffered blob.
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # Static assets are content-hashed by Vite, so they can be cached hard.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Single-page app: unknown paths fall back to index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
