# A different project name from docker-compose.prod.yml on purpose. Sharing one
# would mean sharing container names and the sarjy_pgdata volume, so a bare
# `docker compose up -d` on the production host would adopt the running stack,
# recreate it with this file's development settings, and republish 5432/4000/8080
# against production data -- exactly what the prod file exists to prevent.
name: sarjy-dev

# The whole application: `docker compose up -d --build`, then open
# http://localhost:8080. Reads the repo-root .env for the provider keys and the
# LiteLLM master key.
#
# Only the UI is published. The API, the MCP server and the proxy talk to each
# other over the compose network, so the browser sees one origin and there is no
# CORS. Uncomment a service's `ports` block to reach it from the host directly.

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: sarjy
      POSTGRES_PASSWORD: sarjy
      POSTGRES_DB: sarjy
    ports:
      # Loopback only. The credentials here are the well-known sarjy/sarjy, so
      # publishing on 0.0.0.0 puts an open database on every network the machine
      # joins -- and a Docker publish is not filtered by ufw.
      - "127.0.0.1:5432:5432"
    volumes:
      - sarjy_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sarjy -d sarjy"]
      interval: 5s
      timeout: 3s
      retries: 10

  litellm:
    image: ghcr.io/berriai/litellm:main-stable
    command: ["--config", "/app/config.yaml", "--port", "4000"]
    ports:
      # Loopback only: this proxy holds the real provider keys and its master key
      # defaults to sk-local, so an exposed port is someone else's free inference
      # billed to whoever owns the keys.
      - "127.0.0.1:4000:4000"
    environment:
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY:-sk-local}
    volumes:
      - ./litellm/config.yaml:/app/config.yaml:ro
    healthcheck:
      # The proxy takes tens of seconds to be ready. Without this, `backend`
      # depends on it having merely *started* and the first turns fail against a
      # process that is not listening yet.
      #
      # Four ways to make one HTTP request, because this is someone else's image
      # and which client it ships is not ours to assume. A `backend` that waits
      # on `service_healthy` never starts if the probe itself is broken, so the
      # probe must not depend on a single binary being present.
      test:
        - CMD-SHELL
        - >-
          python3 -c "import urllib.request;urllib.request.urlopen('http://127.0.0.1:4000/health/liveliness',timeout=3)"
          || python -c "import urllib.request;urllib.request.urlopen('http://127.0.0.1:4000/health/liveliness',timeout=3)"
          || curl -fsS http://127.0.0.1:4000/health/liveliness
          || wget -qO- http://127.0.0.1:4000/health/liveliness
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s

  mcp:
    build:
      context: ./sarjy-mcp-server
    environment:
      MCP_SERVER_HOST: 0.0.0.0
      MCP_SERVER_PORT: "8100"
    healthcheck:
      # An MCP initialize handshake, not a bare TCP connect: a hung server still
      # holds its socket open, and the API's own health check cannot see that.
      test: ["CMD", "python", "healthcheck.py"]
      interval: 5s
      timeout: 3s
      retries: 10
    # ports:
    #   - "8100:8100"

  backend:
    build:
      context: ./sarjy-backend
    environment:
      DATABASE_URL: postgresql+psycopg://sarjy:sarjy@postgres:5432/sarjy
      MCP_SERVER_URL: http://mcp:8100/mcp
      # Provider selection stays a LiteLLM model_name: gpt-4o-mini, groq-oss or
      # gemini-flash, from litellm/config.yaml.
      LLM_MODEL: ${LLM_MODEL:-groq-oss}
      LLM_BASE_URL: http://litellm:4000
      LLM_API_KEY: ${LITELLM_MASTER_KEY:-sk-local}
      LLM_RATE_LIMIT_PER_MINUTE: ${LLM_RATE_LIMIT_PER_MINUTE:-20}
      CHAT_HISTORY_LIMIT: ${CHAT_HISTORY_LIMIT:-20}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      # Measurement switch for the MCP-vs-local tool comparison. Ships false.
      USE_LOCAL_WEATHER_TOOL: ${USE_LOCAL_WEATHER_TOOL:-false}
    depends_on:
      postgres:
        condition: service_healthy
      mcp:
        condition: service_healthy
      litellm:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=3)"]
      interval: 5s
      timeout: 3s
      retries: 10
    # ports:
    #   - "8000:8000"

  ui:
    build:
      context: ./sarjy-ui
    ports:
      - "8080:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  sarjy_pgdata:
