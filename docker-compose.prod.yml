name: sarjy

# Production stack for a public host (see docs/DEPLOY.md).
#
#   docker compose -f docker-compose.prod.yml up -d --build
#
# Standalone rather than an override of docker-compose.yml: Compose *appends* to
# `ports:` when merging files, so an override cannot take away the 5432, 4000 and
# 8080 publishes the local file makes. On a public IP those must not exist —
# Docker publishes bypass ufw, so a `ports:` entry is world-reachable whatever
# the host firewall says.
#
# Caddy is the only service with published ports. It terminates TLS with a
# Let's Encrypt certificate it obtains and renews on its own, and everything else
# talks over the compose network.

services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: sarjy
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: sarjy
    volumes:
      - sarjy_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sarjy -d sarjy"]
      interval: 5s
      timeout: 3s
      retries: 10

  litellm:
    image: ghcr.io/berriai/litellm:main-stable
    restart: unless-stopped
    command: ["--config", "/app/config.yaml", "--port", "4000"]
    environment:
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY:?set LITELLM_MASTER_KEY in .env}
    volumes:
      - ./litellm/config.yaml:/app/config.yaml:ro

  mcp:
    build:
      context: ./sarjy-mcp-server
    restart: unless-stopped
    environment:
      MCP_SERVER_HOST: 0.0.0.0
      MCP_SERVER_PORT: "8100"
    healthcheck:
      # The endpoint speaks MCP, not plain HTTP, so this only proves the port is
      # bound — which is what the API's startup connect needs.
      test: ["CMD", "python", "-c", "import socket; socket.create_connection(('127.0.0.1', 8100), timeout=3)"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build:
      context: ./sarjy-backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+psycopg://sarjy:${POSTGRES_PASSWORD}@postgres:5432/sarjy
      MCP_SERVER_URL: http://mcp:8100/mcp
      # Provider selection stays a LiteLLM model_name: gpt-4o-mini, groq-oss or
      # gemini-flash, from litellm/config.yaml.
      LLM_MODEL: ${LLM_MODEL:-groq-oss}
      LLM_BASE_URL: http://litellm:4000
      LLM_API_KEY: ${LITELLM_MASTER_KEY}
      LLM_RATE_LIMIT_PER_MINUTE: ${LLM_RATE_LIMIT_PER_MINUTE:-20}
      CHAT_HISTORY_LIMIT: ${CHAT_HISTORY_LIMIT:-20}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      # Measurement switch for the MCP-vs-local tool comparison. Ships false.
      USE_LOCAL_WEATHER_TOOL: ${USE_LOCAL_WEATHER_TOOL:-false}
    depends_on:
      postgres:
        condition: service_healthy
      mcp:
        condition: service_healthy
      litellm:
        condition: service_started
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=3)"]
      interval: 5s
      timeout: 3s
      retries: 10

  ui:
    build:
      context: ./sarjy-ui
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      SITE_DOMAIN: ${SITE_DOMAIN:?set SITE_DOMAIN in .env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      # The issued certificate lives here. Without a named volume every restart
      # asks Let's Encrypt for a new one, which runs into their rate limits.
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - ui

volumes:
  sarjy_pgdata:
  caddy_data:
  caddy_config:
